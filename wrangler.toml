name = "any-managed-agents"
main = "./server/worker.ts"
compatibility_date = "2026-05-07"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = true
routes = [
  { pattern = "ama.tftt.cc", custom_domain = true },
]

[assets]
binding = "ASSETS"
directory = "./dist/client"
not_found_handling = "single-page-application"
run_worker_first = ["/api", "/api/*", "/runtime/*", "/.well-known/*"]

[vars]
AMA_ALLOWED_ORIGINS = "https://ama.tftt.cc,https://any-managed-agents.saltbo.workers.dev"
AMA_RUNTIME_MODE = "live"
AMA_DEFAULT_MODEL = "@cf/moonshotai/kimi-k2.6"
AMA_AI_GATEWAY_ID = "ama"
OIDC_ISSUER = "https://id.realmroot.dev/api/auth"
OIDC_TRUSTED_BEARER_CLIENT_IDS = "01a02088-aac0-74a9-a5a9-ffca6cf338c0"
OIDC_RESOURCE = "https://ama.tftt.cc/api"
OIDC_BROWSER_SCOPES = "openid profile email agents:read agents:write audit-records:read audit-records:write auth:read auth:write budgets:read budgets:write connectors:read connectors:write environments:read environments:write leases:read leases:write memory-stores:read memory-stores:write projects:read projects:write providers:read providers:write runners:read runners:write sessions:read sessions:write triggers:read triggers:write usage-records:read usage-records:write usage-summary:read usage-summary:write vaults:read vaults:write work-items:read work-items:write"
OIDC_RUNNER_CLIENT_ID = "01a01c2c-b25f-76fa-bc6f-edfc51f235e1"
OIDC_RUNNER_SCOPES = "openid profile email offline_access runners:read runners:write work-items:read work-items:write leases:read leases:write sessions:write"

[triggers]
crons = ["* * * * *"]

[ai]
binding = "AI"

[[ratelimits]]
name = "AUTH_CLIENT_RATE_LIMITER"
namespace_id = "89001"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "AUTH_IP_RATE_LIMITER"
namespace_id = "89002"
simple = { limit = 100, period = 60 }

[[queues.producers]]
binding = "CLOUD_TURNS"
queue = "ama-cloud-turns"

[[queues.producers]]
binding = "TRIGGER_DISPATCHES"
queue = "ama-trigger-dispatches"

[[queues.consumers]]
queue = "ama-cloud-turns"
max_batch_size = 1
max_retries = 5
dead_letter_queue = "ama-cloud-turns-dlq"

# A cloud turn that keeps failing (infra / DB / queue errors) lands here after
# max_retries instead of being silently dropped, stranding the session. The DLQ
# consumer marks the session errored so clients recover. Provision the queue with
# `wrangler queues create ama-cloud-turns-dlq` before deploying.
[[queues.consumers]]
queue = "ama-cloud-turns-dlq"
max_batch_size = 1
max_retries = 1

[[queues.consumers]]
queue = "ama-trigger-dispatches"
max_batch_size = 1
max_retries = 5
dead_letter_queue = "ama-trigger-dispatches-dlq"

[[d1_databases]]
binding = "DB"
database_name = "any-managed-agents-db"
database_id = "1b821d59-c74b-47e4-9af3-3d83de81dc1c"
migrations_dir = "./migrations"

[[r2_buckets]]
binding = "SESSION_EVENTS"
bucket_name = "ama-session-events"

[[durable_objects.bindings]]
name = "SANDBOX"
class_name = "Sandbox"

[[durable_objects.bindings]]
name = "SESSION"
class_name = "SessionObject"

[[durable_objects.bindings]]
name = "RUNNER_POOL"
class_name = "RunnerPoolObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ManagedAgent"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Sandbox"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["RunnerSessionChannelObject"]

# ManagedAgent (the agents-SDK chat DO) was never bound to a binding and is not
# the v1.0 runtime contract; the class is removed. The v1 tag stays as applied
# history; this migration drops the unused class.
[[migrations]]
tag = "v4"
deleted_classes = ["ManagedAgent"]

# The runner session channel DO is generalised into the per-session Session DO
# (browser transport + cloud event store + runner bridge). Rename preserves the
# existing sqlite-class lineage and any live instances; idFromName(sessionId)
# addressing is unchanged.
[[migrations]]
tag = "v5"
renamed_classes = [{ from = "RunnerSessionChannelObject", to = "SessionObject" }]

[[migrations]]
tag = "v6"
new_sqlite_classes = ["RunnerPoolObject"]

[[containers]]
class_name = "Sandbox"
name = "any-managed-agents-sandbox"
image = "./Dockerfile"
max_instances = 20

[observability]
enabled = true

[observability.traces]
enabled = true
head_sampling_rate = 0.05

[env.staging]

[env.staging.vars]
AMA_RUNTIME_MODE = "live"
AMA_DEFAULT_MODEL = "@cf/moonshotai/kimi-k2.6"
OIDC_ISSUER = "https://id.realmroot.dev/api/auth"
OIDC_TRUSTED_BEARER_CLIENT_IDS = ""
OIDC_RESOURCE = "https://any-managed-agents-staging.saltbo.workers.dev/api"
OIDC_BROWSER_SCOPES = "openid profile email agents:read agents:write audit-records:read audit-records:write auth:read auth:write budgets:read budgets:write connectors:read connectors:write environments:read environments:write leases:read leases:write memory-stores:read memory-stores:write projects:read projects:write providers:read providers:write runners:read runners:write sessions:read sessions:write triggers:read triggers:write usage-records:read usage-records:write usage-summary:read usage-summary:write vaults:read vaults:write work-items:read work-items:write"
OIDC_RUNNER_CLIENT_ID = "01a01c2c-b25f-76fa-bc6f-edfc51f235e1"
OIDC_RUNNER_SCOPES = "openid profile email offline_access runners:read runners:write work-items:read work-items:write leases:read leases:write sessions:write"
AMA_ALLOWED_ORIGINS = "https://any-managed-agents-staging.saltbo.workers.dev"

[env.staging.triggers]
