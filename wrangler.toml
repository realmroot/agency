[env.staging.ai]
binding = "AI"

[[env.staging.ratelimits]]
name = "AUTH_CLIENT_RATE_LIMITER"
namespace_id = "89003"
simple = { limit = 10, period = 60 }

[[env.staging.ratelimits]]
name = "AUTH_IP_RATE_LIMITER"
namespace_id = "89004"
simple = { limit = 100, period = 60 }

[[env.staging.queues.producers]]
