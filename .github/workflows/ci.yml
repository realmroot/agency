name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.2
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run lint:arch
      - run: pnpm run lint:spec
      - run: pnpm run lint:escapes
      - run: pnpm run lint:types
      - run: pnpm run typecheck
      - run: pnpm --filter @any-managed-agents/sdk run typecheck
      - run: pnpm --filter @any-managed-agents/sdk run smoke

  contracts:
    name: Contract and SDK Drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.2
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: |
            cmd/ama-runner/go.sum
            sdk/go/go.sum
      - uses: astral-sh/setup-uv@v6
      - run: pnpm install --frozen-lockfile
      # SDK generators are pinned to the versions that produced the committed artifacts.
      - run: go install github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.7.1
      - run: uv tool install openapi-python-client==0.29.0
      - run: echo "$HOME/go/bin" >> "$GITHUB_PATH"
      - run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: pnpm run contract:check
      - run: pnpm run openapi:check

  web-coverage:
    name: Unit and Web Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.2
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: sdk/go/go.sum
      - uses: astral-sh/setup-uv@v6
      - run: pnpm install --frozen-lockfile
      # server/sdk-layout.test.ts runs openapi:check inside the unit suite.
      - run: go install github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.7.1
      - run: uv tool install openapi-python-client==0.29.0
      - run: echo "$HOME/go/bin" >> "$GITHUB_PATH"
      - run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # Coverage gate: unit + web (v8). Fails below 95% business / 90% else, per-file.
      - run: pnpm run test:coverage

  ama-runner-coverage:
    name: AMA Runner Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: cmd/ama-runner/go.sum
      # Coverage gate: ama-runner Go code. Generated protocol bindings are excluded.
      - name: Check ama-runner coverage
        working-directory: cmd/ama-runner
        run: |
          go test ./... -coverprofile=/tmp/ama-runner.cover
          python3 - <<'PY'
          import re
          import subprocess
          import sys

          ignored = ("protocol_gen.go", "session_events_gen.go", "/cmd/ama-runner/main.go")
          with open("/tmp/ama-runner.cover") as source, open("/tmp/ama-runner.filtered.cover", "w") as target:
              target.write(next(source))
              for line in source:
                  if not any(name in line for name in ignored):
                      target.write(line)

          result = subprocess.run(
              ["go", "tool", "cover", "-func=/tmp/ama-runner.filtered.cover"],
              check=True,
              capture_output=True,
              text=True,
          )
          print(result.stdout)
          match = re.search(r"total:\s+\(statements\)\s+([0-9.]+)%", result.stdout)
          if not match:
              print("failed to parse ama-runner coverage total", file=sys.stderr)
              sys.exit(1)
          coverage = float(match.group(1))
          if coverage < 90.0:
              print(f"ama-runner coverage {coverage:.1f}% is below 90.0%", file=sys.stderr)
              sys.exit(1)
          PY

  ama-runner-platforms:
    name: AMA Runner (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: cmd/ama-runner/go.sum
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.2
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run AMA runner tests
        if: runner.os != 'Windows'
        working-directory: cmd/ama-runner
        run: go test -race ./...
      - name: Run Windows AMA runner tests
        if: runner.os == 'Windows'
        working-directory: cmd/ama-runner
        run: go test ./... -run Windows
      - name: Smoke AMA runner binary
        if: runner.os != 'Windows'
        working-directory: cmd/ama-runner
        shell: bash
        run: |
          go build -o "$RUNNER_TEMP/ama-runner" .
          "$RUNNER_TEMP/ama-runner" version --json
      - name: Smoke Windows AMA runner binary
        if: runner.os == 'Windows'
        working-directory: cmd/ama-runner
        shell: pwsh
        run: |
          go build -o "$env:RUNNER_TEMP/ama-runner.exe" .
          & "$env:RUNNER_TEMP/ama-runner.exe" version --json
      - name: Smoke runtime bridge and native CLI lookup
        run: |
          pnpm exec vitest run packages/runtime-bridge/src/providers/cli-host.platform.test.ts
          pnpm run smoke:mock

  ama-runner-cross-build:
    name: AMA Runner Cross Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: cmd/ama-runner/go.sum
      - name: Build supported targets
        working-directory: cmd/ama-runner
        shell: bash
        run: |
          set -euo pipefail
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            suffix=""
            if [[ "$os" == "windows" ]]; then suffix=".exe"; fi
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -o "/tmp/ama-runner-${os}-${arch}${suffix}" .
          done

  integration:
    name: Workerd Integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.2
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The workerd integration crown (real D1) — proven by pass/fail, not %.
      - run: pnpm exec vitest run --project integration

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.2
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      # Cross-stack e2e crown: native Playwright (no Cucumber).
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run e2e

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.2
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
