name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.2
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check embedded runtime bridge bundle
        run: |
          pnpm run bridge:build
          git diff --exit-code -- cmd/ama-runner/pkg/runtimebridge/bundle.mjs
      - run: pnpm run lint
      - run: pnpm run lint:arch
      - run: pnpm run lint:spec
      - run: pnpm run lint:escapes
      - run: pnpm run lint:types
      - run: pnpm run typecheck
      - run: pnpm --filter @any-managed-agents/sdk run typecheck
      - run: pnpm --filter @any-managed-agents/sdk run smoke

  contracts:
    name: Contract and SDK Drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.2
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: |
            cmd/ama-runner/go.sum
            sdk/go/go.sum
      - uses: astral-sh/setup-uv@v6
      - run: pnpm install --frozen-lockfile
      # SDK generators are pinned to the versions that produced the committed artifacts.
      - run: go install github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.7.1
      - run: uv tool install openapi-python-client==0.29.0
      - run: echo "$HOME/go/bin" >> "$GITHUB_PATH"
      - run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: pnpm run contract:check
      - run: pnpm run openapi:check

  web-coverage:
    name: Unit and Web Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.2
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: sdk/go/go.sum
      - uses: astral-sh/setup-uv@v6
      - run: pnpm install --frozen-lockfile
      # server/sdk-layout.test.ts runs openapi:check inside the unit suite.
      - run: go install github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.7.1
      - run: uv tool install openapi-python-client==0.29.0
      - run: echo "$HOME/go/bin" >> "$GITHUB_PATH"
      - run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # Coverage gate: unit + web (v8). Fails below 95% business / 90% else, per-file.
      - run: pnpm run test:coverage

  enbor-runner-coverage:
    name: Enbor Runner Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: cmd/ama-runner/go.sum
      # Coverage gate: ama-runner Go code. Generated protocol bindings are excluded.
      - name: Check ama-runner coverage
        working-directory: cmd/ama-runner
        run: |
          go test ./... -coverprofile=/tmp/ama-runner.cover
          python3 - <<'PY'
          import re
          import subprocess
          import sys

          ignored = ("protocol_gen.go", "session_events_gen.go", "/cmd/ama-runner/main.go")
          with open("/tmp/ama-runner.cover") as source, open("/tmp/ama-runner.filtered.cover", "w") as target:
              target.write(next(source))
              for line in source:
                  if not any(name in line for name in ignored):
                      target.write(line)

          result = subprocess.run(
              ["go", "tool", "cover", "-func=/tmp/ama-runner.filtered.cover"],
              check=True,
              capture_output=True,
              text=True,
          )
          print(result.stdout)
          match = re.search(r"total:\s+\(statements\)\s+([0-9.]+)%", result.stdout)
          if not match:
              print("failed to parse ama-runner coverage total", file=sys.stderr)
              sys.exit(1)
          coverage = float(match.group(1))
          if coverage < 90.0:
              print(f"ama-runner coverage {coverage:.1f}% is below 90.0%", file=sys.stderr)
              sys.exit(1)
          PY

  enbor-runner-platforms:
    name: Enbor Runner (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: cmd/ama-runner/go.sum
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.2
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run Enbor Runner tests
        if: runner.os != 'Windows'
        working-directory: cmd/ama-runner
        run: go test -race ./...
      - name: Run Windows Enbor Runner tests
        if: runner.os == 'Windows'
        working-directory: cmd/ama-runner
        run: go test ./...
      - name: Smoke Enbor Runner binary
        if: runner.os != 'Windows'
        working-directory: cmd/ama-runner
        shell: bash
        run: |
          go build -o "$RUNNER_TEMP/enbor-runner" .
          "$RUNNER_TEMP/enbor-runner" version --json
      - name: Smoke Windows Enbor Runner binary
        if: runner.os == 'Windows'
        working-directory: cmd/ama-runner
        shell: pwsh
        run: |
          go build -o "$env:RUNNER_TEMP/enbor-runner.exe" .
          & "$env:RUNNER_TEMP/enbor-runner.exe" version --json
      - name: Smoke runtime bridge and native CLI lookup
        run: |
          pnpm exec vitest run packages/runtime-bridge/src/host/cli.platform.test.ts
          pnpm run smoke:mock

  enbor-runner-cross-build:
    name: Enbor Runner Cross Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: cmd/ama-runner/go.sum
      - name: Build supported targets
        working-directory: cmd/ama-runner
        shell: bash
        run: |
          set -euo pipefail
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            suffix=""
            if [[ "$os" == "windows" ]]; then suffix=".exe"; fi
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -o "/tmp/enbor-runner-${os}-${arch}${suffix}" .
          done

  enbor-runner-packaging:
    name: Enbor Runner Packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: cmd/ama-runner/go.sum
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: v2.18.0
          install-only: true
      - name: Validate GoReleaser configuration
        run: goreleaser check
      - name: Build and verify release archives
        shell: bash
        run: |
          set -euo pipefail
          goreleaser release --snapshot --clean
          linux_amd64_archive="$(find dist -maxdepth 1 -type f -name 'enbor-runner_*_linux_amd64.tar.gz' -print -quit)"
          linux_arm64_archive="$(find dist -maxdepth 1 -type f -name 'enbor-runner_*_linux_arm64.tar.gz' -print -quit)"
          windows_archive="$(find dist -maxdepth 1 -type f -name 'enbor-runner_*_windows_amd64.zip' -print -quit)"
          test -n "$linux_amd64_archive"
          test -n "$linux_arm64_archive"
          test -n "$windows_archive"
          tar -tzf "$linux_amd64_archive" | grep -Fxq enbor-runner
          tar -tzf "$linux_arm64_archive" | grep -Fxq enbor-runner
          unzip -Z1 "$windows_archive" | grep -Fxq enbor-runner.exe
          grep -Eq '^[0-9a-f]{64}  enbor-runner_.*_linux_amd64.tar.gz$' dist/checksums.txt
          grep -Eq '^[0-9a-f]{64}  enbor-runner_.*_linux_arm64.tar.gz$' dist/checksums.txt
      - name: Build and smoke-test the Runner image
        shell: bash
        run: |
          set -euo pipefail
          context="$RUNNER_TEMP/enbor-runner-image"
          mkdir -p "$context/linux/amd64" "$context/linux/arm64"
          linux_amd64_archive="$(find dist -maxdepth 1 -type f -name 'enbor-runner_*_linux_amd64.tar.gz' -print -quit)"
          linux_arm64_archive="$(find dist -maxdepth 1 -type f -name 'enbor-runner_*_linux_arm64.tar.gz' -print -quit)"
          tar -xzf "$linux_amd64_archive" -C "$context/linux/amd64" enbor-runner
          tar -xzf "$linux_arm64_archive" -C "$context/linux/arm64" enbor-runner
          for platform in amd64 arm64; do
            docker buildx build \
              --platform "linux/$platform" \
              --load \
              --tag "enbor-runner:ci-$platform" \
              --file cmd/ama-runner/Dockerfile.goreleaser \
              "$context"
            docker run --rm --platform "linux/$platform" "enbor-runner:ci-$platform" version --json | grep -Fq '"name":"enbor-runner"'
          done
          credential_dir="$RUNNER_TEMP/enbor-config"
          state_dir="$RUNNER_TEMP/enbor-state"
          workspace_dir="$RUNNER_TEMP/enbor-workspace"
          mkdir -p "$credential_dir" "$state_dir" "$workspace_dir"
          printf '{}\n' > "$credential_dir/credentials.json"
          chmod 600 "$credential_dir/credentials.json"
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --entrypoint sh \
            --volume "$credential_dir:/enbor/config" \
            --volume "$state_dir:/enbor/state" \
            --volume "$workspace_dir:/workspace" \
            enbor-runner:ci-amd64 \
            -c 'test -r /enbor/config/credentials.json && touch /enbor/state/probe /workspace/probe'
          auth_status="$(docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            --env AMA_RUNNER_CREDENTIALS=/enbor/config/credentials.json \
            --volume "$credential_dir:/enbor/config" \
            enbor-runner:ci-amd64 auth status 2>&1 || true)"
          grep -Fq 'not logged in' <<<"$auth_status"

  integration:
    name: Workerd Integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.2
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The workerd integration crown (real D1) — proven by pass/fail, not %.
      - run: pnpm exec vitest run --project integration

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.2
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      # Cross-stack e2e crown: native Playwright (no Cucumber).
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run e2e

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.2
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
