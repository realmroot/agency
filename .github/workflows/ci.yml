name: CI
run-name: ${{ github.event.pull_request.title || github.event.head_commit.message || github.ref_name }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  # Preserve every default-branch and merge-queue result, but supersede stale PR revisions.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Classify Changes
    runs-on: ubuntu-latest
    outputs:
      quality: ${{ steps.classify.outputs.quality }}
      application: ${{ steps.classify.outputs.application }}
      integration: ${{ steps.classify.outputs.integration }}
      e2e: ${{ steps.classify.outputs.e2e }}
      build: ${{ steps.classify.outputs.build }}
      runner: ${{ steps.classify.outputs.runner }}
      runtime: ${{ steps.classify.outputs.runtime }}
      packaging: ${{ steps.classify.outputs.packaging }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Verify change classification
        run: node --test scripts/classify-ci-changes.test.mjs
      - name: Classify changed paths
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MERGE_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: |
          set -euo pipefail
          changed_files="$RUNNER_TEMP/changed-files.txt"

          case "$EVENT_NAME" in
            pull_request)
              git diff --name-only "$PR_BASE_SHA...$PR_HEAD_SHA" > "$changed_files"
              ;;
            merge_group)
              git diff --name-only "$MERGE_BASE_SHA..$MERGE_HEAD_SHA" > "$changed_files"
              ;;
            push)
              if [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
                git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" > "$changed_files"
              else
                git diff --name-only "$BEFORE_SHA..$GITHUB_SHA" > "$changed_files"
              fi
              ;;
            *)
              echo "unsupported CI event: $EVENT_NAME" >&2
              exit 1
              ;;
          esac

          sort -u -o "$changed_files" "$changed_files"
          echo "Changed paths:"
          sed 's/^/  /' "$changed_files"
          node scripts/classify-ci-changes.mjs "$changed_files" | tee -a "$GITHUB_OUTPUT"

  application:
    name: Application CI
    needs: changes
    uses: ./.github/workflows/_application-ci.yml
    with:
      quality: ${{ needs.changes.outputs.quality == 'true' }}
      application: ${{ needs.changes.outputs.application == 'true' }}
      integration: ${{ needs.changes.outputs.integration == 'true' }}
      e2e: ${{ needs.changes.outputs.e2e == 'true' }}
      build: ${{ needs.changes.outputs.build == 'true' }}

  enbor-runner:
    name: Enbor Runner CI
    needs: changes
    uses: ./.github/workflows/_enbor-runner-ci.yml
    with:
      runner: ${{ needs.changes.outputs.runner == 'true' }}
      packaging: ${{ needs.changes.outputs.packaging == 'true' }}

  runtime-bridge:
    name: Runtime Bridge CI
    needs: changes
    uses: ./.github/workflows/_runtime-bridge-ci.yml
    with:
      runtime: ${{ needs.changes.outputs.runtime == 'true' }}

  ci-required:
    name: CI Required
    needs: [changes, application, enbor-runner, runtime-bridge]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify selected workflows
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<<"$JOB_RESULTS"
