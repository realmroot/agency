name: Runtime Bridge CI

on:
  workflow_call:
    inputs:
      runtime:
        required: true
        type: boolean

permissions:
  contents: read

jobs:
  platforms:
    name: Runtime Bridge (${{ matrix.os }})
    if: inputs.runtime
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.30.2
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run packages/runtime-bridge/src/host/cli.platform.test.ts
      - name: Smoke runtime bridge
        if: runner.os == 'Linux'
        run: pnpm run smoke:mock

  runtime-bridge-required:
    name: Runtime Bridge Required
    needs: platforms
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify selected jobs
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<<"$JOB_RESULTS"
