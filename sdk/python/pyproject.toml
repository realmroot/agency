[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "enbor-sdk"
version = "0.1.0"
description = "Generated Python SDK for the Enbor control-plane API"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "httpx>=0.23.1,<0.29.0",
    "attrs>=22.2.0",
    "websockets>=14.0,<16.0",
]

[project.urls]
Homepage = "https://github.com/realmroot/enbor"
Repository = "https://github.com/realmroot/enbor"
Issues = "https://github.com/realmroot/enbor/issues"

[tool.hatch.build.targets.wheel]
packages = ["enbor_sdk"]
